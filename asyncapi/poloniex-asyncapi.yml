                [s, o, l, h, c, qty, amt, tC, sT, cT, ts]. Source:
                polo-sdk-java future/model/event/future/K_lineDataEvent.java
                inner-class comments.
              items:
                type: array
                items: {}

    PoloEnvelope_FuturesTickers:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FuturesTickersData'

    PoloEnvelope_FuturesTradingInfo:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FuturesTradingInfoData'

    PoloEnvelope_FuturesIndexPrice:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
