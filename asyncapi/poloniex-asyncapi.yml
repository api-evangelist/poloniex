        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FuturesAccountChangeData'

    # -------------------------------------------------------------------------
    # Spot data schemas
    # Sources: polo-sdk-java spot/model/event/spot/*.java
    # -------------------------------------------------------------------------

    CandlestickData:
      type: object
      properties:
        symbol: { type: string, description: Symbol name }
        amount: { type: string, description: Quote units traded over the interval }
        high: { type: string, description: Highest price over the interval }
        quantity: { type: string, description: Base units traded over the interval }
        tradeCount: { type: integer, description: Number of trades }
        low: { type: string, description: Lowest price over the interval }
        closeTime: { type: integer, format: int64, description: Close time of interval (ms) }
        startTime: { type: integer, format: int64, description: Start time of interval (ms) }
        close: { type: string, description: Price at end time }
        open: { type: string, description: Price at start time }
        ts: { type: integer, format: int64, description: Time record was pushed (ms) }

    TradeData:
      type: object
      properties:
        symbol: { type: string }
        amount: { type: string, description: Quote units traded }
        takerSide: { type: string, enum: [buy, sell] }
        quantity: { type: string, description: Base units traded }
        createTime: { type: integer, format: int64 }
        price: { type: string }
        id: { type: integer, format: int64 }
        ts: { type: integer, format: int64 }

    TickerData:
      type: object
      properties:
        symbol: { type: string }
        dailyChange: { type: string, description: Daily change in decimal }
        high: { type: string }
        amount: { type: string }
        quantity: { type: string }
        tradeCount: { type: integer }
        low: { type: string }
        closeTime: { type: integer, format: int64 }
        startTime: { type: integer, format: int64 }
        close: { type: string }
        open: { type: string }
        ts: { type: integer, format: int64 }
        markPrice: { type: string }

    BookData:
      type: object
      properties:
        symbol: { type: string }
        createTime: { type: integer, format: int64 }
        asks:
          type: array
          items:
            type: array
            items:
              type: string
            description: '[price, quantity]'
        bids:
          type: array
          items:
            type: array
            items:
              type: string
        id: { type: integer, format: int64, description: Record id (SeqId) }
        ts: { type: integer, format: int64 }

    BookLv2Data:
      type: object
      properties:
        symbol: { type: string }
        asks:
          type: array
          items:
            type: array
            items:
              type: string
        bids:
          type: array
          items:
            type: array
            items:
              type: string
        createTime: { type: integer, format: int64 }
        lastId: { type: integer, format: int64, description: Previous message id }
        id: { type: integer, format: int64, description: Record id (SeqId) }
        ts: { type: integer, format: int64 }

    SymbolData:
      type: object
      properties:
        symbol: { type: string }
        baseCurrencyName: { type: string }
        quoteCurrencyName: { type: string }
        displayName: { type: string }
        state: { type: string, enum: [NORMAL, PAUSE, POST_ONLY] }
        visibleStartTime: { type: integer, format: int64 }
        tradableStartTime: { type: integer, format: int64 }
        symbolTradeLimit:
          type: object
          properties:
            symbol: { type: string }
            priceScale: { type: integer }
            quantityScale: { type: integer }
            amountScale: { type: integer }
            minQuantity: { type: string }
            minAmount: { type: string }
            highestBid: { type: string }
            lowestAsk: { type: string }
        crossMargin:
          type: object
          properties:
            supportCrossMargin: { type: boolean }
            maxLeverage: { type: integer }

    CurrenciesData:
      type: object
      properties:
        currency: { type: string }
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        withdrawalFee: { type: string }
        minConf: { type: integer }
        depositAddress: { type: string }
        blockchain: { type: string }
        delisted: { type: boolean }
        tradingState: { type: string, enum: [NORMAL, OFFLINE] }
        walletState: { type: string, enum: [ENABLED, DISABLED] }
        parentChain: { type: string }
        isMultiChain: { type: boolean }
        isChildChain: { type: boolean }
        supportCollateral: { type: boolean }
        supportBorrow: { type: boolean }
        childChains:
          type: array
          items:
            type: string

    ExchangeData:
      type: object
      properties:
        MM:
          type: string
          enum: [ON, OFF]
          description: Maintenance mode
        POM:
          type: string
          enum: [ON, OFF]
          description: Post-only mode

    OrderData:
      type: object
      properties:
        symbol: { type: string }
        type: { type: string, enum: [MARKET, LIMIT, LIMIT_MAKER] }
        quantity: { type: string }
        orderId: { type: string }
        tradeFee: { type: string }
        clientOrderId: { type: string }
        accountType: { type: string, enum: [SPOT] }
        feeCurrency: { type: string }
        eventType: { type: string, enum: [place, trade, canceled] }
        source: { type: string, enum: [WEB, APP, API] }
        side: { type: string, enum: [BUY, SELL] }
        filledQuantity: { type: string }
        filledAmount: { type: string }
        matchRole: { type: string, enum: [MAKER, TAKER] }
        state:
          type: string
          enum: [NEW, PARTIALLY_FILLED, FILLED, PENDING_CANCEL, PARTIALLY_CANCELED, CANCELED, FAILED]
        tradeTime: { type: integer, format: int64 }
        tradeAmount: { type: string }
        orderAmount: { type: string }
        createTime: { type: integer, format: int64 }
        price: { type: string }
        tradeQty: { type: string }
        tradePrice: { type: string }
        tradeId: { type: string }
        ts: { type: integer, format: int64 }

    BalanceData:
      type: object
      properties:
        changeTime: { type: integer, format: int64 }
        accountId: { type: string }
        eventType: { type: string }
        available: { type: string }
        currency: { type: string }
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        hold: { type: string }
        ts: { type: integer, format: int64 }

    # -------------------------------------------------------------------------
    # Futures data schemas
    # Sources: polo-sdk-java future/model/event/future/*.java
    # -------------------------------------------------------------------------

    FuturesProductInfoData:
      type: object
      properties:
        symbol: { type: string }
        visibleStartTime: { type: string }
        tradableStartTime: { type: string }
        pxScale: { type: string, description: Price precision }
        lotSz: { type: integer, description: Order size precision }
        minSz: { type: integer, description: Minimum order size }
        ctVal: { type: string, description: Contract face value }
        status: { type: string }
        maxPx: { type: string }
        minPx: { type: string }
        maxQty: { type: string }
        minQty: { type: string }
        maxLever: { type: string }
        lever: { type: string }
        ctType: { type: string }
        alias: { type: string }
        bAsset: { type: string }
        bCcy: { type: string }
        qCcy: { type: string }
        sCcy: { type: string }
        tSz: { type: string }
        oDate: { type: string }
        iM: { type: string }
        mM: { type: string }
        mR: { type: string }

    FuturesOrderBookData:
      type: object
      properties:
        s: { type: string, description: Symbol }
        asks:
          type: array
          items:
            type: array
            items:
              type: string
        bids:
          type: array
          items:
            type: array
            items:
              type: string
        id: { type: integer, format: int64 }
        ts: { type: integer, format: int64 }
        cT: { type: integer, format: int64 }

    FuturesOrderBookV2Data:
      type: object
      properties:
        s: { type: string }
        asks:
          type: array
          items:
            type: array
            items:
              type: string
        bids:
          type: array
          items:
            type: array
            items:
              type: string
        lid: { type: integer, format: int64, description: Last version id }
        id: { type: integer, format: int64, description: Current version id }
        ts: { type: integer, format: int64 }
        cT: { type: integer, format: int64 }

    FuturesTickersData:
      type: object
      properties:
        s: { type: string }
        o: { type: string, description: Opening price }
        l: { type: string, description: Lowest price (24h) }
        h: { type: string, description: Highest price (24h) }
        c: { type: string, description: Closing price }
        qty: { type: string, description: Base/contract quantity }
        amt: { type: string, description: Quote quantity }
        tC: { type: integer, format: int64, description: Trades count }
        sT: { type: integer, format: int64, description: 24h interval start }
        cT: { type: integer, format: int64, description: 24h interval end }
        dC: { type: string, description: Daily price change in decimal }
        bPx: { type: string, description: Best bid price }
        bSz: { type: string, description: Best bid size }
        aPx: { type: string, description: Best ask price }
        aSz: { type: string, description: Best ask size }
        ts: { type: integer, format: int64 }

    FuturesTradingInfoData:
      type: object
      properties:
        id: { type: integer, format: int64, description: Trade ID }
        ts: { type: integer, format: int64, description: Push time }
        s: { type: string }
        px: { type: string, description: Execution price }
        qty: { type: string }
        amt: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        cT: { type: integer, format: int64, description: Execution timestamp }

    FuturesIndexPriceData:
      type: object
      properties:
        s: { type: string }
        iPx: { type: string, description: Index price }
        ts: { type: integer, format: int64 }

    FuturesMarkPriceData:
      type: object
      properties:
        s: { type: string }
        mPx: { type: string, description: Mark price }
        ts: { type: integer, format: int64 }

    FuturesFundingRateData:
      type: object
      properties:
        s: { type: string }
        ts: { type: integer, format: int64 }
        fR: { type: string, description: Funding rate }
        fT: { type: integer, format: int64, description: Most recent funding settle ts }
        nFR: { type: string, description: Predicted next funding rate }
        nFT: { type: integer, format: int64, description: Next funding time }

    FuturesPositionsData:
      type: object
      properties:
        symbol: { type: string }
        posSide: { type: string, description: BOTH/LONG/SHORT }
        side: { type: string, enum: [BUY, SELL] }
        mgnMode: { type: string, enum: [ISOLATED, CROSS] }
        openAvgPx: { type: string }
        qty: { type: string }
        oldQty: { type: string }
        availQty: { type: string }
        lever: { type: string }
        fee: { type: string }
        adl: { type: string }
        liqPx: { type: string, description: Estimated liquidation price }
        mgn: { type: string }
        im: { type: string }
        mm: { type: string }
        upl: { type: string, description: Unrealized PnL }
        uplRatio: { type: string }
        fPnl: { type: string }
        pnl: { type: string }
        fFee: { type: string }
        markPx: { type: string }
        mgnRatio: { type: string }
        state: { type: string }
        cTime: { type: integer, format: int64 }
        uTime: { type: integer, format: int64 }

    FuturesOrdersData:
      type: object
      properties:
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        type: { type: string, enum: [MARKET, LIMIT, LIMIT_MAKER] }
        mgnMode: { type: string, enum: [ISOLATED, CROSS, CASH] }
        timeInForce: { type: string, enum: [FOK, IOC, GTC] }
        clOrdId: { type: string }
        sz: { type: string }
        px: { type: string }
        reduceOnly: { type: boolean }
        posSide: { type: string, enum: [BOTH, LONG, SHORT] }
        ordId: { type: string }
        state:
          type: string
          enum: [NEW, PARTIAL_FILLED, FILLED, PARTIAL_CANCELED, CANCELED]
        cancelReason: { type: string }
        source: { type: string }
        avgPx: { type: string }
        execQty: { type: string }
        execAmt: { type: string }
        feeCcy: { type: string }
        feeAmt: { type: string }
        deductCcy: { type: string }
        deductAmt: { type: string }
        cTime: { type: integer, format: int64 }
        uTime: { type: integer, format: int64 }

    FuturesTradeData:
      type: object
      properties:
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        ordId: { type: string }
        clOrdId: { type: string }
        role: { type: string, enum: [MAKER, TAKER] }
        trdId: { type: string }
        feeCcy: { type: string }
        feeAmt: { type: string }
        deductCcy: { type: string }
        deductAmt: { type: string }
        fpx: { type: string, description: Execution price }
        fqty: { type: string, description: Execution size }
        uTime: { type: string, description: Trade update time (ms) }

    FuturesAccountChangeData:
      type: object
      properties:
        state: { type: string }
        eq: { type: string, description: Equity }
        isoEq: { type: string }
        im: { type: string }
        mm: { type: string }
        mmr: { type: string }
        upl: { type: string }
        availMgn: { type: string }
        cTime: { type: string }
        uTime: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              ccy: { type: string }
              eq: { type: string }
              isoEq: { type: string }
              avail: { type: string }
              upl: { type: string }
              isoAvail: { type: string }
              isoHold: { type: string }
              isoUpl: { type: string }
              im: { type: string }
              imr: { type: string }
              mm: { type: string }
              mmr: { type: string }
              cTime: { type: string }
              uTime: { type: string }
