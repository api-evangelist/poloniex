          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CurrenciesData'

    PoloEnvelope_Exchange:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ExchangeData'

    PoloEnvelope_Order:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/OrderData'

    PoloEnvelope_Balance:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/BalanceData'

    PoloEnvelope_FuturesProductInfo:
      allOf:
