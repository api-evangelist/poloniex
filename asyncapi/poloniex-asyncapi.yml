          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/BookLv2Data'

    PoloEnvelope_Symbol:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SymbolData'

    PoloEnvelope_Currencies:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
