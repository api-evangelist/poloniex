        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FuturesProductInfoData'

    PoloEnvelope_FuturesOrderBook:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FuturesOrderBookData'

    PoloEnvelope_FuturesOrderBookV2:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FuturesOrderBookV2Data'

    PoloEnvelope_FuturesKline:
      allOf:
