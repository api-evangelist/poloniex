          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TradeData'

    PoloEnvelope_Ticker:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TickerData'

    PoloEnvelope_Book:
      allOf:
        - $ref: '#/components/schemas/PoloEnvelopeBase'
